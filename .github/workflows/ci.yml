name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore ReachCommander.slnx

      - name: Test .NET
        run: dotnet test ReachCommander.slnx -c Release --no-restore --logger "trx;LogFilePrefix=backend-${{ matrix.os }}" --results-directory artifacts/test-results/${{ matrix.os }}

      - name: Report failing Ubuntu backend tests
        if: failure() && matrix.os == 'ubuntu-latest'
        run: python tools/report_trx.py "artifacts/test-results/${{ matrix.os }}/backend-*.trx"

      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics-${{ matrix.os }}
          path: artifacts/test-results/${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    name: Frontend and browser acceptance (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/reach-commander-ui/package-lock.json
            tests/e2e/package-lock.json

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Test installer render configuration
        run: python3 tools/run_with_annotations.py "Installer render configuration failed" python3 -m unittest tests/installer/test_render_config.py -v

      - name: Test CI diagnostic reporter
        run: python3 -m unittest tests/ci/test_report_trx.py tests/ci/test_run_with_annotations.py -v

      - name: Test Ubuntu installer command contracts
        run: |
          bash tests/installer/test_common.sh
          bash tests/installer/test_install.sh
          bash tests/installer/test_command.sh
          bash tests/installer/test_package.sh

      - name: Test release workflow and documentation contracts
        run: node --test tests/installer/release-tags.test.mjs tests/installer/workflow-contract.test.mjs tests/installer/docs-contract.test.mjs

      - name: Lint Ubuntu installer scripts
        run: |
          shellcheck -x --source-path=SCRIPTDIR \
            deploy/install.sh \
            deploy/reachcommander \
            deploy/lib/common.sh \
            deploy/package-installer.sh \
            tests/installer/test_common.sh \
            tests/installer/test_install.sh \
            tests/installer/test_command.sh \
            tests/installer/test_package.sh

      - name: Restore .NET dependencies
        run: dotnet restore ReachCommander.slnx

      - name: Install Angular dependencies
        run: npm ci
        working-directory: client/reach-commander-ui

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Test Angular
        run: npm test -- --watch=false
        working-directory: client/reach-commander-ui

      - name: Verify PWA source contract
        run: npm run test:pwa
        working-directory: client/reach-commander-ui

      - name: Build Angular
        run: npm run build
        working-directory: client/reach-commander-ui

      - name: Verify production PWA
        run: npm run verify:pwa
        working-directory: client/reach-commander-ui

      - name: Publish API
        run: dotnet publish src/ReachCommander.Api/ReachCommander.Api.csproj -c Release --no-restore -o artifacts/publish -p:BuildAngularOnPublish=false

      - name: Verify bundled archive worker
        run: |
          test -f artifacts/publish/archive-worker/ReachCommander.ArchiveWorker.dll
          test -f artifacts/publish/archive-worker/ReachCommander.ArchiveWorker.deps.json
          test -f artifacts/publish/archive-worker/ReachCommander.ArchiveWorker.runtimeconfig.json
          test -f artifacts/publish/archive-worker/SharpCompress.dll
          test -f artifacts/publish/archive-worker/SharpCompress-LICENSE.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run browser acceptance
        run: npm test
        working-directory: tests/e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics-ubuntu
          path: |
            artifacts/playwright-results
            artifacts/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    name: Hardened amd64 container smoke
    if: github.event_name == 'push'
    needs: [backend, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build candidate image
        run: docker build --tag reachcommander:smoke .

      - name: Run hardened health smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          smoke_root="$(mktemp -d)"
          cleanup() {
            docker rm --force reachcommander-smoke >/dev/null 2>&1 || true
            rm -rf -- "$smoke_root"
          }
          trap cleanup EXIT
          mkdir -p "$smoke_root/source"
          mkdir -p "$smoke_root/data/auth" "$smoke_root/data/keys"
          chmod 0755 "$smoke_root" "$smoke_root/source"
          chmod 0700 "$smoke_root/data" "$smoke_root/data/auth" "$smoke_root/data/keys"
          sudo chown -R 1000:1000 "$smoke_root/data"
          python3 deploy/render_config.py create-request \
            --output "$smoke_root/request.json" \
            --bind-address 127.0.0.1 \
            --port 38092 \
            --uid 1000 \
            --gid 1000 \
            --image ghcr.io/dragosniamtu/reach-commander:stable
          python3 deploy/render_config.py add-source \
            --request "$smoke_root/request.json" \
            --id smoke \
            --name Smoke \
            --host-path "$smoke_root/source" \
            --access ro \
            --default-left true \
            --default-right true
          python3 deploy/render_config.py render \
            --request "$smoke_root/request.json" \
            --template deploy/compose.release.yaml \
            --output "$smoke_root/deployment"
          docker compose --project-directory "$smoke_root/deployment" config --quiet
          docker run --rm --detach \
            --name reachcommander-smoke \
            --user 1000:1000 \
            --read-only \
            --tmpfs /tmp:size=32m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1::8080 \
            --mount "type=bind,source=$smoke_root/deployment/config,target=/config,readonly" \
            --mount "type=bind,source=$smoke_root/data,target=/data" \
            --mount "type=bind,source=$smoke_root/source,target=/sources/smoke,readonly" \
            reachcommander:smoke
          healthy=false
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' reachcommander-smoke)"
            if [[ "$status" == healthy ]]; then
              healthy=true
              break
            fi
            if [[ "$status" == unhealthy || "$status" == missing ]]; then
              docker logs --tail 200 reachcommander-smoke
              exit 1
            fi
            sleep 2
          done
          [[ "$healthy" == true ]]
          published="$(docker port reachcommander-smoke 8080/tcp)"
          port="${published##*:}"
          curl --fail --show-error --silent "http://127.0.0.1:$port/health"

  container-publish:
    name: Publish verified multi-architecture image
    if: github.event_name == 'push'
    needs: [backend, acceptance, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: reachcommander-container-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/dragosniamtu/reach-commander

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Require version tags to belong to master
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Resolve approved publication tags
        id: release
        run: node deploy/release-tags.mjs "$GITHUB_REF" "$IMAGE" "$GITHUB_OUTPUT"

      - name: Allocate unique candidate tag
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate="$IMAGE:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'tag=%s\n' "$candidate" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish amd64 and arm64 candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.title=ReachCommander
            org.opencontainers.image.description=Self-hosted dual-pane file manager for Windows development and Ubuntu deployment
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/master/docs/deployment/ubuntu.md
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Select retry-safe publication source
        id: publication_source
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          selected_reference="$CANDIDATE_TAG"
          selected_digest="$CANDIDATE_DIGEST"
          reused_immutable=false

          if [[ -n "$VERSION" ]]; then
            version_reference="$IMAGE:$VERSION"
            if docker buildx imagetools inspect --raw "$version_reference" \
              >existing-version-manifest.json \
              2>existing-version-error.txt; then
              existing_digest="sha256:$(sha256sum existing-version-manifest.json | cut -d' ' -f1)"
              docker pull --quiet --platform linux/amd64 "$version_reference" >/dev/null
              existing_revision="$(
                docker image inspect \
                  --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                  "$version_reference"
              )"
              if [[ "$existing_revision" != "$GITHUB_SHA" ]]; then
                printf 'ReachCommander: immutable tag %s belongs to revision %s, not %s.\n' \
                  "$version_reference" "$existing_revision" "$GITHUB_SHA" >&2
                exit 1
              fi
              selected_reference="$version_reference"
              selected_digest="$existing_digest"
              reused_immutable=true
              printf 'Reusing retry-safe immutable publication %s at %s.\n' \
                "$selected_reference" "$selected_digest"
            elif grep --extended-regexp --ignore-case --quiet \
              '(manifest unknown|not found)' existing-version-error.txt; then
              printf 'Immutable publication %s does not exist yet.\n' "$version_reference"
            else
              cat existing-version-error.txt >&2
              printf 'ReachCommander: could not safely determine whether immutable tag %s exists.\n' \
                "$version_reference" >&2
              exit 1
            fi
          fi

          [[ "$selected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'reference=%s\n' "$selected_reference" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$selected_digest" >>"$GITHUB_OUTPUT"
          printf 'reused=%s\n' "$reused_immutable" >>"$GITHUB_OUTPUT"

      - name: Resolve retry-safe promotion tags
        id: promotion_tags
        shell: bash
        env:
          REUSED_IMMUTABLE: ${{ steps.publication_source.outputs.reused }}
          STABLE_RELEASE: ${{ steps.release.outputs.stableRelease }}
        run: |
          set -Eeuo pipefail
          : >repository-tags.txt
          if [[ "$STABLE_RELEASE" == 'true' ]]; then
            git fetch --no-tags origin master
            git fetch --tags origin
            git tag --merged origin/master >repository-tags.txt
          fi
          node deploy/release-tags.mjs \
            resolve-promotion-tags \
            "$GITHUB_REF" \
            "$IMAGE" \
            repository-tags.txt \
            "$REUSED_IMMUTABLE" \
            "$GITHUB_OUTPUT"

      - name: Verify publication source platforms and attestations
        shell: bash
        env:
          SOURCE_DIGEST: ${{ steps.publication_source.outputs.digest }}
          SOURCE_REFERENCE: ${{ steps.publication_source.outputs.reference }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$SOURCE_REFERENCE" >/dev/null
          docker buildx imagetools inspect --raw "$SOURCE_REFERENCE" >manifest.json
          actual_source_digest="sha256:$(sha256sum manifest.json | cut -d' ' -f1)"
          [[ "$actual_source_digest" == "$SOURCE_DIGEST" ]]
          node <<'NODE'
          const fs = require('node:fs');
          const document = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const manifests = document.manifests ?? [];
          const runnable = new Set(
            manifests
              .filter((item) => item.platform?.os === 'linux')
              .map((item) => `linux/${item.platform.architecture}`),
          );
          for (const required of ['linux/amd64', 'linux/arm64']) {
            if (!runnable.has(required)) {
              throw new Error(`Missing runnable platform: ${required}`);
            }
          }
          const attestations = manifests.filter(
            (item) =>
              item.platform?.os === 'unknown' &&
              item.platform?.architecture === 'unknown' &&
              item.annotations?.['vnd.docker.reference.type'] === 'attestation-manifest',
          );
          if (attestations.length < 2) {
            throw new Error('Expected provenance/SBOM attestation-manifest descriptors.');
          }
          NODE

      - name: Promote verified image tags
        shell: bash
        env:
          SOURCE_DIGEST: ${{ steps.publication_source.outputs.digest }}
          TARGET_TAGS: ${{ steps.promotion_tags.outputs.tags }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          promotion_arguments=()
          while IFS= read -r target_tag; do
            [[ -n "$target_tag" ]] || continue
            promotion_arguments+=(--tag "$target_tag")
          done <<<"$TARGET_TAGS"
          (( ${#promotion_arguments[@]} > 0 ))
          docker buildx imagetools create \
            "${promotion_arguments[@]}" \
            "$IMAGE@$SOURCE_DIGEST"

          while IFS= read -r target_tag; do
            [[ -n "$target_tag" ]] || continue
            actual_digest="sha256:$(
              docker buildx imagetools inspect --raw "$target_tag" |
                sha256sum |
                cut -d' ' -f1
            )"
            [[ "$actual_digest" == "$SOURCE_DIGEST" ]]
          done <<<"$TARGET_TAGS"

      - name: Build and verify stable installer assets
        if: steps.release.outputs.stableRelease == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          bash deploy/package-installer.sh "$VERSION" artifacts/installer
          cd artifacts/installer
          sha256sum --check SHA256SUMS

      - name: Create or update stable GitHub Release
        if: steps.release.outputs.stableRelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --generate-notes --title "ReachCommander $VERSION"
          fi
          gh release upload "$VERSION" artifacts/installer/reachcommander-installer.tar.gz artifacts/installer/SHA256SUMS --clobber
