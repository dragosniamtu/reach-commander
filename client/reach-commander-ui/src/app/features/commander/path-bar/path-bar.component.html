<div class="path-shell">
  <span class="root-mark" aria-hidden="true">/</span>
  @if (editing()) {
    <input
      #editor
      class="path-input"
      aria-label="Logical directory path"
      spellcheck="false"
      autocomplete="off"
      [value]="draft()"
      (input)="updateDraft($event)"
      (keydown)="handleKey($event)"
      (blur)="commit()"
    />
  } @else {
    @if (readOnly()) {
      <input
        #editor
        class="path-display"
        type="text"
        readonly
        aria-readonly="true"
        aria-label="Read-only archive path"
        title="Archive paths are read-only; select the path to copy it"
        [value]="path()"
        (focus)="$any($event.target).select()"
        (click)="$any($event.target).select()"
      />
    } @else {
      <button
        type="button"
        class="path-display"
        title="Edit path (Ctrl+L)"
        (click)="focusEditor()"
      >{{ path() }}</button>
    }
  }
</div>
