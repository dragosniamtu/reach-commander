<label class="filter-shell">
  <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m14.3 13.1 4 4-1.2 1.2-4-4a7 7 0 1 1 1.2-1.2ZM8.8 14A5.2 5.2 0 1 0 8.8 3.6 5.2 5.2 0 0 0 8.8 14Z"/></svg>
  <span class="sr-only">Quick filter</span>
  <input
    type="search"
    placeholder="Quick filter"
    autocomplete="off"
    [value]="value()"
    (input)="update($event)"
  />
  @if (value()) {
    <button type="button" aria-label="Clear quick filter" (click)="valueChanged.emit('')">×</button>
  }
</label>
