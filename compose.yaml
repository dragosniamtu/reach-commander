services:
  reachcommander:
    build:
      context: .
      dockerfile: Dockerfile
    image: reachcommander:local
    container_name: reachcommander
    cpus: "${REACHCOMMANDER_CPU_LIMIT:-3.0}"
    user: "1000:1000"
    ports:
      - "8092:8080"
    environment:
      ReverseProxy__TrustNetworkGateways: "true"
    volumes:
      - ./config:/config:ro
      - reachcommander-data:/data
      - ./dev-sources/downloads:/sources/downloads:ro
      - ./dev-sources/media:/sources/media:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  reachcommander-data:
