# ReachCommander Nginx example. Replace the hostname, certificates, and password file.
# Create the password file outside the repository, for example with:
#   sudo htpasswd -cB /etc/nginx/reachcommander.htpasswd admin

server {
    listen 80;
    listen [::]:80;
    server_name reachcommander.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reachcommander.example.com;

    ssl_certificate /etc/letsencrypt/live/reachcommander.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reachcommander.example.com/privkey.pem;

    auth_basic "ReachCommander";
    auth_basic_user_file /etc/nginx/reachcommander.htpasswd;

    client_max_body_size 50G;
    client_body_timeout 6h;
    send_timeout 6h;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
