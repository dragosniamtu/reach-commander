# ReachCommander Traefik static configuration example.
# Replace the ACME email and persist acme.json with mode 0600.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 6h
        writeTimeout: 6h
        idleTimeout: 6h

providers:
  file:
    filename: /etc/traefik/traefik.dynamic.yaml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com
      storage: /var/lib/traefik/acme.json
      httpChallenge:
        entryPoint: web
